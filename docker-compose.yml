version: "3.9"

services:
  stt-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: stt-kyutai:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      HF_HOME: /home/app/.cache/huggingface
      TRANSFORMERS_CACHE: /home/app/.cache/huggingface
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface-cache:
